name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/lightweight-mode
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows-portable.yml"
      - "package.json"
      - "package-lock.json"
      - "config.example.json"
      - "src/**"
      - "src-ui/**"
      - "src-tauri/**"
      - "tools/**"
      - "tests/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "ai-reminder.js"
      - "index.html"

permissions:
  contents: read
  actions: write

concurrency:
  group: build-windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-win-x64:
    name: Portable win-x64
    runs-on: windows-latest
    timeout-minutes: 75

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: portable-win-x64

      - name: Configure temp paths for CI
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "ai-cli-complete-notify"
          $npmCache = Join-Path $env:RUNNER_TEMP "npm-cache"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          New-Item -ItemType Directory -Force -Path $npmCache | Out-Null
          "AI_NOTIFY_TMP_DIR=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "npm_config_cache=$npmCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "AI_NOTIFY_TMP_DIR=$tmp"
          Write-Host "npm_config_cache=$npmCache"

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build portable package
        run: npm run dist:portable

      - name: List dist outputs
        shell: pwsh
        run: |
          if (-not (Test-Path dist)) {
            throw "dist directory not found"
          }
          Get-ChildItem dist -Recurse -File |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize
          $zip = Get-ChildItem dist -Filter "ai-cli-complete-notify-*-portable-win-x64.zip" -File -ErrorAction SilentlyContinue
          if (-not $zip) {
            throw "portable zip not found in dist/"
          }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ai-cli-complete-notify-${{ github.sha }}-portable-win-x64
          path: dist/ai-cli-complete-notify-*-portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14
