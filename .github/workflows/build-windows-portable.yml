name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - feat/lightweight-mode
    paths:
      - '.github/workflows/build-windows-portable.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'src-ui/**'
      - 'src-tauri/**'
      - 'tools/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'ai-reminder.js'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: build-windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-win-x64:
    name: Portable win-x64
    runs-on: windows-latest
    timeout-minutes: 75

    env:
      CARGO_TERM_COLOR: always
      # Prefer runner temp so tools/run-tauri-build.js does not require a D: drive.
      AI_NOTIFY_TMP_DIR: ${{ runner.temp }}\ai-cli-complete-notify
      npm_config_cache: ${{ runner.temp }}\npm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: portable-win-x64

      - name: Install npm dependencies
        run: npm ci

      - name: Build portable package
        run: npm run dist:portable

      - name: List dist outputs
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ai-cli-complete-notify-${{ github.sha }}-portable-win-x64
          path: |
            dist/ai-cli-complete-notify-*-portable-win-x64.zip
            dist/ai-cli-complete-notify-*-portable-win-x64/**
          if-no-files-found: error
          retention-days: 14
